<div class="menu-page">
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div>
                <h1>Nosso Cardápio</h1>
                <p>Escolha sua felicidade em forma de doce</p>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" placeholder="Buscar produto..." [(ngModel)]="searchQuery" />
            </div>
        </div>

        <!-- Categories -->
        <div class="categories">
            <button *ngFor="let cat of categories" (click)="selectCategory(cat.id)"
                [class.active]="activeCategory === cat.id">
                {{ cat.label }}
            </button>
        </div>

        <!-- Products Grid -->
        <div class="products-grid">
            <div *ngFor="let product of filteredProducts()" class="product-card">
                <div class="card-shadow"></div>
                <div class="card-content">
                    <div class="card-image">
                        <img [src]="product.image" [alt]="product.name" />
                        <div class="category-label">{{ product.category }}</div>
                    </div>
                    <div class="card-body">
                        <h3>{{ product.name }}</h3>
                        <p>{{ product.description }}</p>
                        <div class="card-footer">
                            <div class="price">
                                <span>Preço</span>
                                <span>R$ {{ product.price.toFixed(2) }}</span>
                            </div>
                            <button (click)="handleBuy(product.id)">
                                Comprar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Nenhum produto -->
        <div *ngIf="filteredProducts().length === 0" class="no-products">
            <p>Nenhum produto encontrado :(</p>
        </div>

    </div>
</div>
