<div class="space-y-4">
    <div class="card-display">
        <div class="card-left">
            <div class="card-icon-bg">
                <lucide-icon [name]="CreditCard" [size]="20"></lucide-icon>
            </div>
            <div>
                <p class="font-bold">•••• 4242</p>
                <p class="card-sub">Visa - 12/28</p>
            </div>
        </div>
        <div class="dot-active"></div>
    </div>

    <button class="btn-add-card" routerLink="/account/saved-payments">
        <lucide-icon [name]="Plus" [size]="20"></lucide-icon>
        Adicionar cartão
    </button>
</div>
