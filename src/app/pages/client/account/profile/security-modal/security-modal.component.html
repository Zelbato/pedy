<div class="overlay" (click)="close.emit()">
    <div class="modal" (click)="$event.stopPropagation()">

        <div class="modal-header">
            <div class="header-title">
                <lucide-icon name="shield" [size]="20" class="title-icon"></lucide-icon>
                <h2>Segurança</h2>
            </div>
            <button class="close-btn" (click)="close.emit()">
                <lucide-icon name="close" [size]="20"></lucide-icon>
            </button>
        </div>

        <div class="modal-body">
            <div class="step-container" *ngIf="passwordStep === 'initial'">
                <div class="info-card">
                    <p>Mantenha sua conta protegida atualizando sua senha regularmente.</p>
                    <button class="btn-primary" (click)="changeStep.emit('current')">
                        Alterar senha
                    </button>
                </div>
            </div>

            <div class="step-container" *ngIf="passwordStep === 'current'">
                <p class="step-label">Digite sua senha atual para continuar:</p>
                <div class="input-wrapper">
                    <lucide-icon name="lock" [size]="18" class="field-icon"></lucide-icon>
                    <input type="password" placeholder="Senha atual">
                </div>
                <button class="btn-primary" (click)="changeStep.emit('new')">
                    Continuar
                </button>
            </div>

            <div class="step-container" *ngIf="passwordStep === 'new'">
                <p class="step-label">Escolha uma senha forte:</p>
                <div class="input-wrapper">
                    <lucide-icon name="lock" [size]="18" class="field-icon"></lucide-icon>
                    <input type="password" placeholder="Nova senha">
                </div>
                <div class="input-wrapper">
                    <lucide-icon name="lockOpen" [size]="18" class="field-icon"></lucide-icon>
                    <input type="password" placeholder="Confirmar nova senha">
                </div>
                <button class="btn-primary" (click)="changeStep.emit('initial')">
                    Salvar Nova Senha
                </button>
            </div>

            <div class="divider"></div>

            <div class="twofa-section">
                <div class="twofa-info">
                    <span class="twofa-title">Autenticação 2FA</span>
                    <span class="twofa-status" [class.enabled]="is2FAEnabled">
                        {{ is2FAEnabled ? 'Ativado' : 'Desativado' }}
                    </span>
                </div>
                <button class="btn-toggle" [class.active]="is2FAEnabled" (click)="toggle2FA.emit()">
                    {{ is2FAEnabled ? 'Desativar' : 'Ativar' }}
                </button>
            </div>
        </div>

    </div>
</div>
