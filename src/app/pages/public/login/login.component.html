<div class="login-page">
    <div class="login-card" @cardAnimation>

        <div class="card-header">
            <div class="logo-box">
                <a routerLink="/" class="logo">
                    <img src="assets/img/logo.jpeg" alt="logo" class="logo-icon">
                </a>
            </div>
            <h1>Bem-vindo!</h1>
            <p>Acesse sua conta para continuar.</p>
        </div>

        <form (submit)="handleLogin()" #loginForm="ngForm" class="login-form">

            <div class="input-field">
                <label>E-mail</label>
                <div class="input-wrapper">
                    <i class="lucide-mail"></i>
                    <input type="email" name="email" required placeholder="seu@email.com" ngModel>
                </div>
            </div>

            <div class="input-field">
                <div class="label-row">
                    <label>Senha</label>
                    <a routerLink="/esqueci-senha" class="forgot-link">Esqueceu sua senha?</a>
                </div>

                <div class="input-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
                        #passwordModel="ngModel" required minlength="8" placeholder="••••••••">

                    <button type="button" class="btn-toggle-eye" (click)="showPassword = !showPassword">
                        <lucide-icon [name]="showPassword ? 'eyeOff' : 'eye'" [size]="20" />
                    </button>
                </div>

                <div class="error" *ngIf="passwordModel.touched && passwordModel.invalid">
                    <span *ngIf="passwordModel.errors?.['required']">
                        A senha é obrigatória
                    </span>

                    <span *ngIf="passwordModel.errors?.['minlength']">
                        A senha deve ter no mínimo 8 caracteres
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
                @if (isLoading) {
                <div class="spinner"></div>
                } @else {
                <span>Entrar agora</span>
                <lucide-icon name="arrowRight" [size]="20"></lucide-icon>
                }
            </button>

            <div class="divider">
                <span>Ou</span>
            </div>

            <button type="button" class="btn-google">
                <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="24" height="24" viewBox="0 0 48 48">
                    <path fill="#FFC107"
                        d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z">
                    </path>
                    <path fill="#FF3D00"
                        d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z">
                    </path>
                    <path fill="#4CAF50"
                        d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z">
                    </path>
                    <path fill="#1976D2"
                        d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z">
                    </path>
                </svg>
                Entrar com Google
            </button>
        </form>

        <p class="signup-text">
            Ainda nÃ£o tem conta?
            <a routerLink="/register">Cadastre-se</a>
        </p>
    </div>
</div>
