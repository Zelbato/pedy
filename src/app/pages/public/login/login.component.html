<div class="login-page">
    <div class="login-card" @cardAnimation>

        <div class="card-header">
            <div class="logo-box">
                <a routerLink="/" class="logo">
                    <img src="assets/img/logo.jpeg" alt="logo" class="logo-icon">
                </a>
            </div>
            <h1>Bem-vindo!</h1>
            <p>Acesse sua conta para continuar.</p>
        </div>

        <form (submit)="handleLogin()" #loginForm="ngForm" class="login-form">

            <div class="input-field">
                <label>E-mail</label>
                <div class="input-wrapper">
                    <i class="lucide-mail"></i>
                    <input type="email" name="email" required placeholder="seu@email.com" ngModel>
                </div>
            </div>

            <div class="input-field">
                <div class="label-row">
                    <label>Senha</label>
                    <a routerLink="/esqueci-senha" class="forgot-link">Esqueceu sua senha?</a>
                </div>

                <div class="input-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
                        #passwordModel="ngModel" required minlength="8" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">

                    <button type="button" class="btn-toggle-eye" (click)="showPassword = !showPassword">
                        <lucide-icon [name]="showPassword ? 'eyeOff' : 'eye'" [size]="20" />
                    </button>
                </div>

                <div class="error" *ngIf="passwordModel.touched && passwordModel.invalid">
                    <span *ngIf="passwordModel.errors?.['required']">
                        A senha Ã© obrigatÃ³ria
                    </span>

                    <span *ngIf="passwordModel.errors?.['minlength']">
                        A senha deve ter no mÃ­nimo 8 caracteres
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
                @if (isLoading) {
                <div class="spinner"></div>
                } @else {
                <span>Entrar agora</span>
                <lucide-icon name="arrowRight" [size]="20"></lucide-icon>
                }
            </button>

            <div class="divider">
                <span>Ou</span>
            </div>

            <button type="button" class="btn-google">
                <lucide-icon name="googleIcon" [size]="24" />
                Entrar com Google
            </button>
        </form>

        <p class="signup-text">
            Ainda nÃ£o tem conta?
            <a routerLink="/register">Cadastre-se</a>
        </p>
    </div>
</div>
