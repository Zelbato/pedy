<section class="newsletter-section">
    <div class="container">
        <div class="newsletter-card">

            <div class="card-bg">
                <div class="blob-top"></div>
                <div class="blob-bottom"></div>
            </div>

            <div class="content">
                <div class="icon-wrapper">
                    <lucide-icon name="heart" [size]="64" class="heart-icon"></lucide-icon>
                </div>

                <h2 class="title">
                    RECEBA NOVIDADES <br>
                    E OFERTAS EXCLUSIVAS
                </h2>

                <p class="subtitle">
                    Faça parte do nosso clube e receba em primeira mão lançamentos,
                    cupons de desconto e conteúdos especiais sobre nossas delícias.
                </p>

                <form class="newsletter-form">
                    <input type="email" placeholder="Seu melhor e-mail" class="email-input" />
                    <button type="submit" class="submit-button">
                        INSCREVER AGORA
                    </button>
                </form>
            </div>

        </div>
    </div>
</section>
