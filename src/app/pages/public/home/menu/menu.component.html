<section class="featured-section">
    <div class="bg-elements">
        <div class="blur-circle"></div>
        <div class="carbon-pattern"></div>
    </div>

    <div class="container">
        <div class="header-content">
            <div class="title-area">
                <div class="badge">
                    <span class="line"></span>
                    <span class="badge-text">SELEÇÃO PREMIUM</span>
                </div>
                <h2 class="main-title">
                    OS MAIS <br />
                    <span class="italic">DESEJADOS</span>
                </h2>
                <p class="description">
                    Uma seleção exclusiva dos nossos produtos mais amados, preparados com ingredientes premium e muito
                    carinho.
                </p>
            </div>

            <div class="view-all-wrapper">
                <a href="/cardapio" class="circle-button">
                    <span class="button-text">VER TODOS</span>
                    <div class="dashed-ring"></div>
                </a>
            </div>
        </div>

        <div class="products-grid">
            <div class="product-card" *ngFor="let product of featuredProducts; let i = index">
                <div class="card-inner">

                    <div class="image-container">
                        <img [src]="product.image" [alt]="product.name" class="product-img">
                    </div>

                    <div class="card-details">
                        <div class="rating-row">
                            <div class="stars">
                                <lucide-icon name="star" [size]="12" *ngFor="let s of [1,2,3,4,5]"></lucide-icon>
                            </div>
                            <span class="choice-label">Promoção do Dia</span>
                        </div>

                        <h3 class="product-name">{{ product.name }}</h3>

                        <div class="price-action">
                            <div class="price-info">
                                <span class="price-label">Preço</span>
                                <p class="price-value">R$ {{ product.price | number:'1.2-2' }}</p>
                            </div>

                            <a [href]="'/payment/' + product.id" class="buy-button">
                                COMPRAR AGORA
                            </a>
                        </div>
                    </div>

                    <div class="hover-glow"></div>
                </div>
            </div>
        </div>
    </div>
</section>
