<nav class="navbar" [class.scrolled]="scrolled">
    <div class="container">
        <div class="navbar-inner">
            <a routerLink="/" class="logo">
                <img src="assets/img/logo.jpeg" alt="logo" class="logo-icon">
            </a>
            <div class="menu">
                <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                    INICIO
                </a>
                <a routerLink="/cardapio" routerLinkActive="active">
                    CARDÁPIO
                </a>
                <a routerLink="/orders" routerLinkActive="active" class="menu-item">
                    MEUS PEDIDOS
                </a>
                <span class="underline"></span>
            </div>

            <div class="actions" *ngIf="isLoggedIn">
                <div class="dropdown-wrapper" #notificationsRef>
                    <button class="icon-btn" (click)="toggleNotifications()">
                        <lucide-icon [name]="Bell" [size]="20" class="icon"></lucide-icon>
                        <span *ngIf="unreadNotifications > 0" class="dot"></span>
                    </button>

                    <div *ngIf="isNotificationsOpen" @dropdownAnim class="dropdown notifications">
                        <div class="header">
                            <h3>NOTIFICAÇÕES</h3>
                            <span *ngIf="notifications.length">
                                {{ unreadNotifications }} NOVAS
                            </span>
                        </div>

                        <div class="list">
                            <button *ngFor="let n of notifications" (click)="markNotificationRead(n.id)" class="item"
                                [class.unread]="!n.read">

                                <div class="item-icon"></div>

                                <div class="text">
                                    <p>{{ n.title }}</p>
                                    <small>{{ n.message }}</small>
                                    <span class="time">{{ n.time }}</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="dropdown-wrapper" #cartRef>
                    <button class="icon-btn" (click)="toggleCart()">
                        <lucide-icon [name]="ShoppingCart" [size]="20" class="icon"></lucide-icon>
                        <span *ngIf="pendingOrder" class="badge">1</span>
                    </button>

                    <div *ngIf="isCartOpen" @dropdownAnim class="dropdown cart">
                        <div class="header">
                            <h3>CARRINHO</h3>
                        </div>

                        <div *ngIf="pendingOrder; else emptyCart" class="cart-body">
                            <div class="product">
                                <img [src]="pendingOrder.image">
                                <div class="info">
                                    <p>{{ pendingOrder.name }}</p>
                                    <span>R$ {{ pendingOrder.price }}</span>
                                </div>
                            </div>

                            <button class="btn primary" (click)="continueOrder()">
                                CONTINUAR →
                            </button>
                            <button class="btn danger" (click)="clearCart()">
                                CANCELAR
                            </button>
                        </div>
                        <ng-template #emptyCart>
                            <div class="empty">Carrinho vazio</div>
                        </ng-template>
                    </div>
                </div>
            </div>

            <div class="cta">
                <div *ngIf="isLoggedIn; else loginButton" class="profile-container">
                    <button class="profile-btn" (click)="toggleProfile()">
                        <div class="icon-box">
                            <lucide-icon name="person" [size]="20"></lucide-icon>
                        </div>
                        <div class="profile-text">
                            <span class="small">MINHA CONTA</span>
                            <span class="big">PERFIL</span>
                        </div>
                        <lucide-icon name="arrowBottom" [size]="24" class="arrow" [class.rotate]="isProfileOpen">
                        </lucide-icon>
                    </button>

                    <!-- DROPDOWN -->
                    <div class="profile-menu" *ngIf="isProfileOpen">
                        <div class="menu-header">
                            <span class="welcome">BEM-VINDO DE VOLTA</span> <br>
                            <span class="client">CLIENTE ESPECIAL</span>
                        </div>
                        <a routerLink="/account/profile" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="person" [size]="20"></lucide-icon>
                            </div>
                            Perfil
                        </a>

                        <a routerLink="/account/loyalty" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="star" [size]="20"></lucide-icon>
                            </div>
                            Cartão Fidelidade
                        </a>

                        <a routerLink="/account/addresses" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="location_add" [size]="20"></lucide-icon>
                            </div>
                            Endereços
                        </a>

                        <a routerLink="/account/settings" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="settings" [size]="20"></lucide-icon>
                            </div>
                            Configurações
                        </a>

                        <div class="divider"></div>

                        <button (click)="logout()" class="logout">
                            <div class="menu-icon-logout">
                                <lucide-icon name="logout" [size]="20" class="icon-logout"></lucide-icon>
                            </div>
                            <span class="logout-text">Sair</span>
                        </button>
                    </div>
                </div>

                <!-- DESLOGADO -->
                <ng-template #loginButton>
                    <a routerLink="/login" class="login-link">
                        <lucide-icon name="person" [size]="20"></lucide-icon>
                        ENTRAR
                    </a>
                </ng-template>

            </div>
        </div>
    </div>
</nav>
