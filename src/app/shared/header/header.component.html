<nav class="navbar" [class.scrolled]="scrolled">
    <div class="container">
        <div class="navbar-inner">
            <a routerLink="/" class="logo">
                <img src="assets/img/logo.jpeg" alt="logo" class="logo-icon">
            </a>
            <div class="menu">
                <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                    INICIO
                </a>
                <a routerLink="/cardapio" routerLinkActive="active">
                    CARDÁPIO
                </a>
                <a routerLink="/orders" routerLinkActive="active" class="menu-item">
                    <lucide-icon name="receipt_long" [size]="20"></lucide-icon>
                    MEUS PEDIDOS
                </a>
                <span class="underline"></span>
            </div>
            <div class="cta">
                <div *ngIf="isLoggedIn; else loginButton" class="profile-container">
                    <button class="profile-btn" (click)="toggleProfile()">
                        <div class="icon-box">
                            <lucide-icon name="person" [size]="20"></lucide-icon>
                        </div>
                        <div class="profile-text">
                            <span class="small">MINHA CONTA</span>
                            <span class="big">PERFIL</span>
                        </div>
                        <lucide-icon name="arrowBottom" [size]="24" class="arrow" [class.rotate]="isProfileOpen">
                        </lucide-icon>
                    </button>

                    <!-- DROPDOWN -->
                    <div class="profile-menu" *ngIf="isProfileOpen">
                        <div class="menu-header">
                            <span class="welcome">BEM-VINDO DE VOLTA</span> <br>
                            <span class="client">CLIENTE ESPECIAL</span>
                        </div>
                        <a routerLink="/account/profile" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="person" [size]="20"></lucide-icon>
                            </div>
                            Perfil
                        </a>

                        <a routerLink="/account/loyalty" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="star" [size]="20"></lucide-icon>
                            </div>
                            Cartão Fidelidade
                        </a>

                        <a routerLink="/account/addresses" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="location_add" [size]="20"></lucide-icon>
                            </div>
                            Endereços
                        </a>

                        <a routerLink="/account/settings" (click)="toggleProfile()">
                            <div class="menu-icon">
                                <lucide-icon name="settings" [size]="20"></lucide-icon>
                            </div>
                            Configurações
                        </a>

                        <div class="divider"></div>

                        <button (click)="logout()" class="logout">
                            <div class="menu-icon-logout">
                                <lucide-icon name="logout" [size]="20" class="icon-logout"></lucide-icon>
                            </div>
                            <span class="logout-text">Sair</span>
                        </button>
                    </div>
                </div>

                <!-- DESLOGADO -->
                <ng-template #loginButton>
                    <a routerLink="/login" class="login-link">
                        <lucide-icon name="person" [size]="20"></lucide-icon>
                        ENTRAR
                    </a>
                </ng-template>

            </div>
        </div>
    </div>
</nav>
